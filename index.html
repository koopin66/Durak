<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Дурак</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Верхняя панель: бот, козырь, новая игра -->
    <header class="top-bar">
      <div class="player">
        <div class="avatar">🤖</div>
        <div>
          <div class="player-name">Бот</div>
          <div id="bot-count" class="player-sub"></div>
        </div>
      </div>
      <div id="trump-badge" class="trump-badge"></div>
      <button id="new-game-btn" class="icon-btn" aria-label="Новая игра">↻</button>
    </header>

    <section id="bot-hand" class="hand hand--bot"></section>

    <section class="middle">
      <div id="deck" class="deck"></div>
      <div id="table" class="table"></div>
    </section>

    <p id="status" class="status"></p>

    <section id="my-hand" class="hand hand--me"></section>

    <footer class="controls">
      <button id="take-btn" class="btn">Беру</button>
      <button id="done-btn" class="btn btn--primary">Бито</button>
    </footer>
  </div>

  <div id="overlay" class="overlay hidden">
    <div class="modal">
      <div id="result" class="result"></div>
      <button id="again-btn" class="btn btn--primary">Играть ещё</button>
    </div>
  </div>

  <script src="js/deck.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
