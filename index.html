<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120b08">
  <title>Дурак</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="scene" aria-label="Игровой стол"></canvas>
  <div class="vignette"></div>
  <div id="bubble" class="bubble"></div>

  <div id="app">
    <!-- Верхняя панель: соперник, козырь, звук, новая игра -->
    <header class="top-bar">
      <div class="player">
        <button id="bot-avatar" class="avatar" aria-label="Сменить соперника">👴</button>
        <div>
          <div id="bot-name" class="player-name">Соперник</div>
          <div id="bot-count" class="player-sub"></div>
        </div>
      </div>
      <div id="trump-badge" class="trump-badge"></div>
      <button id="sound-btn" class="icon-btn" aria-label="Звук">🔊</button>
      <button id="new-game-btn" class="icon-btn" aria-label="Новая игра">↻</button>
    </header>

    <!-- 2D-стол: показывается, только если нет WebGL -->
    <section id="bot-hand" class="hand hand--bot board2d"></section>
    <section class="middle board2d">
      <div id="deck" class="deck"></div>
      <div id="table" class="table"></div>
    </section>
    <div class="spacer"></div>

    <p id="status" class="status"></p>

    <section id="my-hand" class="hand hand--me board2d"></section>

    <footer class="controls">
      <button id="take-btn" class="btn">Беру</button>
      <button id="done-btn" class="btn btn--primary">Бито</button>
    </footer>
  </div>

  <div id="start" class="overlay overlay--start hidden">
    <div class="modal modal--start">
      <h1 class="logo">Дурак</h1>
      <p class="tagline">Кто сегодня сядет с вами за стол?</p>
      <div id="opponents" class="opponents"></div>
      <button id="play-btn" class="btn btn--primary">Сесть за стол</button>
    </div>
  </div>

  <div id="overlay" class="overlay hidden">
    <div class="modal">
      <div id="result" class="result"></div>
      <div id="result-sub" class="result-sub"></div>
      <button id="again-btn" class="btn btn--primary">Играть ещё</button>
      <button id="change-btn" class="btn btn--ghost">Сменить соперника</button>
    </div>
  </div>

  <script src="vendor/three.min.js"></script>
  <script src="js/deck.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/opponents.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/3d/textures.js"></script>
  <script src="js/3d/room.js"></script>
  <script src="js/3d/characters.js"></script>
  <script src="js/3d/cards.js"></script>
  <script src="js/3d/scene.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
